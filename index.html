<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首儲禮包 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold-1: #fff6cf; --gold-2: #f5c95a; --gold-3: #c98a1e; --gold-4: #6e4208;
  --purple-0: #0b0519; --purple-1: #1a0c3a; --purple-2: #2a1260; --purple-3: #46208a;
  --magenta-1: #8e1a7c; --magenta-2: #d43ab8; --magenta-3: #ff6fdc;
  --text: #f6eeff; --muted: #b8a6da; --red: #ff3b5c; --green: #3fe39a;
  --ui-bg: #121118; --ui-line: #2a2734; --ui-text: #e7e4ef; --ui-muted: #9893a8; --ui-accent: #f5c95a;
  --gold-text: linear-gradient(180deg, #fffbe6 0%, #f8d670 50%, #c07c14 100%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #09080d; color: var(--ui-text); font-family: "Noto Sans TC", system-ui, sans-serif; }
button { font-family: inherit; cursor: pointer; }

/* ---------- page layout ---------- */
.app { display: flex; height: 100vh; }
.viewport { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--ui-line); }
.toolbar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--ui-line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; color: var(--ui-muted); border: 0; padding: 6px 14px; font-size: 13px; }
.seg button.on { background: var(--ui-accent); color: #2a1a00; font-weight: 700; }
.clock { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ui-muted); }
.clock b { color: var(--ui-text); }
.area { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 16px; min-height: 320px; }
.stage-holder { position: relative; flex: none; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.6); color: var(--text); }
.stage.land { width: 1280px; height: 720px; }
.stage.port { width: 720px; height: 1280px; }

.panel { width: 360px; flex: none; border-left: 1px solid var(--ui-line); overflow: auto; padding: 16px; background: var(--ui-bg); font-size: 13px; }
.panel h2 { font-size: 13px; letter-spacing: .04em; color: var(--ui-accent); margin: 18px 0 8px; }
.panel h2:first-child { margin-top: 0; }
.panel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.panel select, .panel input { background: #1c1a24; color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
.panel input[type=number] { width: 96px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn { background: #24212e; color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
.btn:hover { border-color: var(--ui-accent); }
.btn.primary { background: var(--ui-accent); color: #2a1a00; border-color: var(--ui-accent); font-weight: 700; }
.btn.warn { border-color: #6b3540; color: #ffb3c0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
.kv span:nth-child(odd) { color: var(--ui-muted); }
.tier-chips { display: flex; gap: 6px; }
.tier-chips div { flex: 1; text-align: center; background: #1c1a24; border: 1px solid var(--ui-line); border-radius: 6px; padding: 6px 4px; }
.tier-chips small { display: block; color: var(--ui-muted); font-size: 11px; }
.tier-chips b { font-size: 15px; font-variant-numeric: tabular-nums; }
.note { color: var(--ui-muted); font-size: 12px; line-height: 1.6; }
.note.alert { color: #ffcf7a; }
.ratio-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.ratio-table th, .ratio-table td { border-bottom: 1px solid var(--ui-line); padding: 4px 2px; text-align: left; }
.ratio-table th { color: var(--ui-muted); font-weight: 500; }
.log { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow: auto; font-size: 12px; }
.log li { padding: 4px 0; border-bottom: 1px dashed var(--ui-line); }
.log time { color: var(--ui-muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
@media (max-width: 960px) {
  .app { flex-direction: column; height: auto; }
  .area { height: 72vh; }
  .panel { width: auto; border-left: 0; border-top: 1px solid var(--ui-line); }
}

/* ---------- lobby ---------- */
.lobby { position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(212,58,184,.35), transparent 55%),
    radial-gradient(ellipse at 50% 110%, rgba(245,201,90,.18), transparent 50%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 28px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 28px),
    linear-gradient(180deg, var(--purple-2), var(--purple-0)); }
.topbar { position: absolute; left: 0; right: 0; top: 0; height: 84px; display: flex; align-items: center; gap: 16px; padding: 0 24px;
  background: linear-gradient(180deg, rgba(10,4,26,.9), rgba(10,4,26,.4)); border-bottom: 2px solid rgba(245,201,90,.35); }
.avatar { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--gold-2); background: radial-gradient(circle at 40% 35%, #8f6bd6, #3a1d74); display: grid; place-items: center; font-weight: 900; font-size: 22px; }
.pname { font-weight: 700; font-size: 18px; }
.balances { margin-left: auto; display: flex; gap: 12px; }
.bal { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 6px; border-radius: 22px; background: rgba(0,0,0,.45); border: 1px solid rgba(245,201,90,.4); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.bal svg { width: 34px; height: 34px; }
.side-icons { position: absolute; left: 24px; top: 110px; display: flex; flex-direction: column; gap: 18px; }
.stage.port .side-icons { left: 20px; top: 104px; flex-direction: row; }
.entry { position: relative; width: 104px; text-align: center; cursor: pointer; animation: bob 2.4s ease-in-out infinite; }
.entry .box { width: 96px; height: 96px; margin: 0 auto; border-radius: 22px; display: grid; place-items: center;
  background: linear-gradient(160deg, var(--magenta-3), var(--magenta-1)) padding-box, linear-gradient(160deg, var(--gold-1), var(--gold-3)) border-box;
  border: 3px solid transparent; box-shadow: 0 0 24px rgba(255,111,220,.55); }
.entry .box svg { width: 64px; height: 64px; }
.entry .label { margin-top: 4px; font-weight: 900; font-size: 18px; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
.entry .chip { display: inline-block; margin-top: 2px; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,.65); font-size: 14px; font-weight: 700; color: #ffd36b; font-variant-numeric: tabular-nums; }
.dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--red); border: 3px solid #fff; color: #fff; font-size: 12px; font-weight: 900; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.entry .dot { right: 0; top: -6px; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

.machines { position: absolute; display: grid; gap: 22px; }
.stage.land .machines { left: 170px; right: 60px; top: 130px; bottom: 96px; grid-template-columns: repeat(4, 1fr); }
.stage.port .machines { left: 40px; right: 40px; top: 290px; bottom: 150px; grid-template-columns: repeat(2, 1fr); }
.machine { position: relative; border-radius: 20px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px;
  border: 3px solid rgba(245,201,90,.6); box-shadow: inset 0 0 40px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.5); transition: transform .15s; }
.machine:hover { transform: translateY(-4px); }
.machine:active { transform: scale(.98); }
.machine .sym { position: absolute; left: 0; right: 0; top: 18%; text-align: center; font-size: 96px; font-weight: 900; opacity: .9;
  background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0,0,0,.5)); }
.machine .mname { font-size: 26px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.7); }
.machine .play { margin-top: 6px; font-size: 15px; color: var(--gold-1); opacity: .9; }
.float-plus { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font-size: 40px; font-weight: 900; color: var(--gold-1); text-shadow: 0 2px 0 #000; pointer-events: none; animation: floatUp .9s ease-out forwards; }
@keyframes floatUp { to { transform: translate(-50%, -70px); opacity: 0; } }
.room { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; z-index: 2; }
.room-back { position: absolute; left: 24px; top: 24px; padding: 10px 24px; border-radius: 26px; background: rgba(0,0,0,.55); border: 2px solid var(--gold-2); color: var(--gold-1); font-size: 22px; font-weight: 900; font-family: inherit; cursor: pointer; }
.room-name { font-size: 48px; font-weight: 900; text-shadow: 0 3px 0 rgba(0,0,0,.7); }
.reels { display: flex; gap: 18px; }
.reel { width: 160px; height: 190px; border-radius: 18px; background: rgba(0,0,0,.42); border: 3px solid rgba(245,201,90,.6); display: grid; place-items: center; box-shadow: inset 0 0 30px rgba(0,0,0,.5); }
.reel span { font-size: 100px; font-weight: 900; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0,0,0,.5)); }
.spin { position: relative; width: 240px; height: 84px; border-radius: 42px; border: 3px solid #fff3c4; background: linear-gradient(180deg, #ffd96b, #e09a1c); color: #5a2a00; font-size: 34px; font-weight: 900; font-family: inherit; cursor: pointer; box-shadow: 0 6px 0 #8a4d05, 0 10px 18px rgba(0,0,0,.5); }
.spin:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a4d05; }
.room-hint { padding: 10px 24px; border-radius: 26px; background: rgba(0,0,0,.6); font-size: 20px; }
.room-hint b { color: var(--gold-2); font-variant-numeric: tabular-nums; }
.room-hint.ready { color: var(--gold-1); font-weight: 900; border: 2px solid var(--gold-2); animation: bob 1.6s ease-in-out infinite; }
.hint-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 26px; padding: 10px 24px; border-radius: 26px; background: rgba(0,0,0,.6); border: 1px solid rgba(245,201,90,.4); font-size: 17px; white-space: nowrap; }
.stage.port .hint-bar { bottom: 60px; font-size: 18px; white-space: normal; width: 640px; text-align: center; }
.hint-bar b { color: var(--gold-2); font-variant-numeric: tabular-nums; }

/* ---------- dialogs ---------- */
.dlg-wrap { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; animation: fadeIn .15s; z-index: 5; }
.dlg { width: 560px; max-width: 90%; border-radius: 22px; padding: 30px 30px 24px; text-align: center; border: 3px solid transparent;
  background: linear-gradient(180deg, #2c1468, #160938) padding-box, linear-gradient(160deg, var(--gold-1), var(--gold-3)) border-box; animation: popIn .25s cubic-bezier(.2,1.4,.4,1); }
.dlg h3 { margin: 0 0 14px; font-size: 32px; font-weight: 900; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dlg p { font-size: 19px; line-height: 1.6; margin: 8px 0; color: #e9dcff; }
.dlg .demo-tag { font-size: 14px; color: var(--muted); }
.dlg .btns { display: flex; gap: 14px; justify-content: center; margin-top: 18px; }
.dlg .btns button { min-width: 160px; height: 58px; border-radius: 16px; font-size: 22px; font-weight: 900; border: 2px solid var(--gold-2); }
.dlg .ok { background: linear-gradient(180deg, #fff1a8, #f5c95a 50%, #c98a1e); color: #5a2a00; }
.dlg .cancel { background: #2b1356; color: var(--gold-1); }
.reward-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin: 10px 0; }
.reward-grid .ri { width: 130px; padding: 10px 6px; border-radius: 14px; background: rgba(0,0,0,.35); border: 1px solid rgba(245,201,90,.35); }
.reward-grid svg { width: 70px; height: 70px; }
.reward-grid .iname { font-size: 14px; color: var(--muted); }
.reward-grid .iamt { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--gold-1); }
.rules { text-align: left; padding-left: 26px; margin: 0; font-size: 18px; line-height: 1.65; color: #e9dcff; }
.toast { position: absolute; left: 50%; top: 90px; transform: translateX(-50%); padding: 12px 26px; border-radius: 24px; background: rgba(0,0,0,.82); border: 1px solid var(--gold-2); color: var(--gold-1); font-size: 20px; font-weight: 700; white-space: nowrap; z-index: 9; animation: toast 2.6s forwards; pointer-events: none; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* ---------- pack popup: mockup art + live text overlays ---------- */
.overlay { position: absolute; inset: 0; background: rgba(6,0,16,.72); display: flex; align-items: center; justify-content: center; }
.overlay.enter { animation: fadeIn .2s; }
.overlay.enter .skin-frame { animation: popIn .28s cubic-bezier(.2,1.4,.4,1); }
.dlg-wrap, .dlg { animation: none; }
.dlg-wrap.enter { animation: fadeIn .15s; }
.dlg-wrap.enter .dlg { animation: popIn .25s cubic-bezier(.2,1.4,.4,1); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { transform: scale(.85); opacity: 0; } }
@keyframes shine { 50% { box-shadow: 0 0 34px rgba(255,215,122,.9), inset 0 0 18px rgba(255,215,122,.35); } }

.skin-frame { position: relative; flex: none; }
.skin { position: absolute; left: 0; top: 0; transform-origin: 0 0; font-weight: 900; }
.skin > * { position: absolute; }
.skin-base { left: 0; top: 0; pointer-events: none; user-select: none; }
.skin button { font-family: inherit; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
.gold { background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #3a1000) drop-shadow(0 0 1.5px #3a1000); }
.box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.12; white-space: nowrap; }

.skin-tab img { position: absolute; }
.skin-tab .lbl { position: relative; z-index: 1; height: 100%; gap: 2px; }
.skin-tab .t-step { font-size: var(--fs-step); color: #e9dcf2; }
.skin-tab .t-price { font-size: var(--fs-price); color: #d9cfe3; font-variant-numeric: tabular-nums; }
.skin-tab.active .t-step { color: #fff; }
.skin-tab .t-status { font-size: var(--fs-status); color: #c6b8d4; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.skin-tab.st-open .t-status { color: #ffd36b; }
.skin-tab.st-purchased .t-status { color: var(--green); }
.skin-tab svg.lock { width: 1em; height: 1em; }
.skin-tab .dot { left: 10px; top: -8px; z-index: 4; transform: scale(1.4); }
.skin-tab .tab-tag { position: absolute; right: var(--tag-x); top: var(--tag-y); width: var(--tag); height: var(--tag); z-index: 3; background: #f0c45a; transform: rotate(10deg); pointer-events: none;
  clip-path: polygon(50% 0%,61% 11%,75% 6%,79% 21%,94% 25%,89% 39%,100% 50%,89% 61%,94% 75%,79% 79%,75% 94%,61% 89%,50% 100%,39% 89%,25% 94%,21% 79%,6% 75%,11% 61%,0% 50%,11% 39%,6% 25%,21% 21%,25% 6%,39% 11%);
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.skin-tab .tab-tag-in { position: absolute; inset: 4px; clip-path: inherit; background: radial-gradient(circle at 40% 35%, #d8283a, #8e0c22 72%); gap: 0; }
.skin-tab .tab-tag small { font-size: calc(var(--tag) * .2); }
.skin-tab .tab-tag b { font-size: calc(var(--tag) * .26); font-variant-numeric: tabular-nums; }

.skin-badge { transform: rotate(-8deg); }
.skin-badge small { font-size: var(--fs-badge-s); }
.skin-badge b { font-size: var(--fs-badge-b); font-variant-numeric: tabular-nums; }
.skin-total .l1 { font-size: var(--fs-total-l); color: #f6e7c4; text-shadow: 0 3px 0 #2a0010; }
.skin-total .l2 { font-size: var(--fs-total-n); font-variant-numeric: tabular-nums; }
.skin-total .l2 span { font-size: .55em; margin-left: 8px; }
.skin-timer { flex-direction: row; gap: 8px; font-size: var(--fs-timer); color: #f6e7c4; font-variant-numeric: tabular-nums; }
.skin-timer.done { color: var(--green); }
.skin-timer.dim { color: #c6b8d4; }

.skin-card { border-radius: 14px; }
.skin-card.clickable { cursor: pointer; }
.skin-card .hd { position: absolute; left: 0; right: 0; top: var(--hd-top); height: var(--hd-h); flex-direction: row; gap: 14px; }
.skin-card .hd .n { font-size: var(--fs-hd); color: #f6eaff; text-shadow: 0 2px 0 #2a0030; }
.skin-card .hd .p { font-size: calc(var(--fs-hd) * 1.15); }
.skin-card .row { position: absolute; right: 4px; align-items: flex-start; }
.skin-card .row .nm { font-size: var(--fs-name); color: #eadff5; font-weight: 700; }
.skin-card .row .am { font-size: var(--fs-amt); font-variant-numeric: tabular-nums; }
.skin-card .glow { position: absolute; inset: 0; border-radius: 14px; border: 4px solid #ffd77a; animation: shine 1.4s ease-in-out infinite; pointer-events: none; }
.skin-card .shade { position: absolute; inset: 0; border-radius: 14px; background: rgba(12,4,24,.62); }
.skin-card .stamp { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%) rotate(-12deg); width: var(--stamp); height: var(--stamp); border-radius: 50%; border: 5px solid var(--green); color: var(--green); display: grid; place-items: center; font-size: calc(var(--stamp) * .22); background: rgba(10,40,25,.82); }
.skin-card .pill { position: absolute; left: 50%; bottom: calc(var(--fs-pill) * -0.9); transform: translateX(-50%); padding: 3px 16px; border-radius: 16px; font-size: var(--fs-pill); background: #1a0a26; border: 2px solid #c9952f; color: #f6e7c4; white-space: nowrap; z-index: 1; }
.skin-card.claimable .pill, .skin-card.makeup .pill { background: linear-gradient(180deg, #fff1a8, #e8b33a); color: #5a2a00; border-color: #fff3c4; }
.skin-card .dot { left: 8px; top: 8px; transform: scale(1.3); }

.skin-cta { display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: var(--cta-r); font-size: var(--fs-cta); }
.skin-cta.buy { padding-bottom: var(--cta-depth); color: #fff; text-shadow: 0 3px 0 rgba(10,60,5,.75), 0 0 2px rgba(10,60,5,.9); }
.skin-cta.buy:active { transform: translateY(3px); }
.skin-cta.claim { background: linear-gradient(180deg, #fff1a8, #f5c95a 50%, #c98a1e); color: #5a2a00; text-shadow: 0 2px 0 rgba(255,255,255,.6); box-shadow: 0 8px 0 #7a4c0c; animation: shine 1.4s infinite; }
.skin-cta:disabled { background: linear-gradient(180deg, #5a5070, #2e2742); color: #d6cde6; box-shadow: 0 8px 0 #1a1530; font-size: calc(var(--fs-cta) * .55); cursor: default; }
.skin-cta small { font-size: .6em; margin-left: 8px; }
.skin-note { font-size: var(--fs-note); color: #bfb0d0; font-weight: 700; white-space: normal; line-height: 1.4; }
.skin-close { border-radius: 50%; }
.land .skin-close { border: 4px solid #f0c45a; background: radial-gradient(circle at 40% 35%, #9a1a3a, #5a0a24); color: #fff3d6; font-size: 40px; }
.skin .skin-info { border-radius: 50%; border: 3px solid #f0c45a; background: #3a1236; color: #fff3d6; font-size: 26px; }

.ico { display: block; object-fit: contain; }
.ico.plain, .row-ico.plain { filter: grayscale(1) brightness(1.5) contrast(1.1); }
.skin-card .row-ico { position: absolute; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
.skin-card .row-ico.plain { filter: grayscale(1) brightness(1.5) contrast(1.1) drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
.skin-card .row .bonus { margin-left: 6px; padding: 1px 6px; border-radius: 6px; font-size: .8em; background: #d8283a; color: #fff3d6; vertical-align: 2px; }
.bal .ico { width: 34px; height: 34px; }
.reward-grid .ico { width: 76px; height: 76px; margin: 0 auto; }
.dlg { background: linear-gradient(180deg, #23133a, #1b0f2d) padding-box, linear-gradient(160deg, #ffe7a3, #c48a22) border-box; }
</style>
</head>
<body>

<!-- shared gradients for inline icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGift" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6cf"/><stop offset="1" stop-color="#e3a52a"/></linearGradient>

// Convert to blob URLs once and pre-decode, so re-renders reuse cached bitmaps instead of re-parsing base64
const ART_CACHE = [];
for (const [key, uri] of Object.entries(ART)) {
  const bin = atob(uri.split(",")[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  ART[key] = URL.createObjectURL(new Blob([bytes], { type: "image/webp" }));
  const img = new Image();
  img.src = ART[key];

}

<script>
// ===================== CONFIG (placeholder values, replace with real data) =====================
// Price ladder: assumed; only 33 / 70 / 130 / 370 / 12000 come from the spec.
const LADDER = [33, 70, 130, 370, 670, 990, 1690, 3290, 6490, 12000];
const TRIGGER_HANDS = 5;
// Trigger: player with < 5 career hands reaches 5 hands, popup shows on returning to the casino lobby
const STAGE_WINDOW_SEC = 48 * 3600;
const START_SEC = 14 * 3600;            // demo clock starts at D0 14:00

// Reward ratio per stage, in % of the stage price (total = sum of the three days)
const STAGE_RATIOS = [
  { total: 300, days: [150, 50, 100] },
  { total: 250, days: [130, 50, 70] },
  { total: 200, days: [120, 30, 50] },
];

// Currency (神幣 + 龍幣) fills the shown %; items are bonus on top and are NOT counted in the shown %
const COIN_PER_NTD = 100;
const DRAGON_PER_COIN = 10000;
const ITEM_COIN_VALUE = { dice: 100000, gold: 1000000, crit: 3000 };  // shop price in 神幣
// Day 1: 100% of the price as 神幣, the rest of the day-1 % as 龍幣
// Bonus items: day 2 = 必定暴擊 (count by price band); day 3 = 1 一般骰子 (stages 1-2) / 1 金骰子 (stage 3)
const CRIT_BONUS = [[130, 1], [990, 2], [Infinity, 5]];

// ===================== ICONS =====================
const giftSvg = () => `<svg viewBox="0 0 100 100"><rect x="14" y="40" width="72" height="50" rx="6" fill="#b5209a" stroke="url(#gGift)" stroke-width="5"/><rect x="10" y="28" width="80" height="18" rx="5" fill="#d43ab8" stroke="url(#gGift)" stroke-width="5"/><rect x="44" y="28" width="12" height="62" fill="url(#gGift)"/><path d="M50 28 C36 6 18 16 30 28 M50 28 C64 6 82 16 70 28" fill="none" stroke="url(#gGift)" stroke-width="6" stroke-linecap="round"/></svg>`;
const lockSvg = () => `<svg class="lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="3" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>`;

// Display rule: 神幣 always first, other items below
const ITEM_ORDER = ["coin", "dragon", "gold", "dice", "crit"];
const byItemOrder = (a, b) => ITEM_ORDER.indexOf(a.id) - ITEM_ORDER.indexOf(b.id);

const ITEMS = {
  coin:   { name: "神幣", short: "神幣", art: "coin", icon: () => `<img class="ico" src="${ART.coin}" alt="">` },
  dragon: { name: "龍幣", short: "龍幣", art: "dragon", icon: () => `<img class="ico" src="${ART.dragon}" alt="">` },
  dice:   { name: "星際漫遊-一般骰子", short: "一般骰子", art: "dice", icon: () => `<img class="ico plain" src="${ART.dice}" alt="">` },
  gold:   { name: "星際漫遊-金骰子", short: "金骰子", art: "dice", icon: () => `<img class="ico" src="${ART.dice}" alt="">` },
  crit:   { name: "王者之劍-必定暴擊", short: "必定暴擊", art: "sword", icon: () => `<img class="ico" src="${ART.sword}" alt="">` },
};

// ===================== STATE =====================
const STEP_NAMES = ["第一階", "第二階", "第三階"];
const DAY_NAMES = ["第一天", "第二天", "第三天"];

const state = {
  orient: "land",
  maxSingle: 130,         // career highest single top-up; null = never paid
  now: START_SEC,
  paused: false,
  hands: 0,
  inMachine: null,        // index of the machine being played; null = in lobby
  triggeredAt: null,
  tiers: null,            // snapshot at trigger
  stages: null,
  popup: false,
  activeTab: 0,
  dialog: null,           // { type, ... }
  balances: { coin: 52300, dragon: 120, dice: 0, crit: 0 },
  log: [],
};

function freshStages() {
  return [0, 1, 2].map(() => ({ purchasedAt: null, claimed: [false, false, false] }));
}

// ===================== RULES =====================
function ladderIndex(amount) {
  let idx = -1;
  LADDER.forEach((p, i) => { if (p <= amount) idx = i; });
  return idx;
}

function tiersFor(maxSingle) {
  const top = LADDER.length - 1;
  if (maxSingle == null) return [LADDER[0], LADDER[1], LADDER[2]];
  const idx = ladderIndex(maxSingle);
  if (idx <= 0) return [LADDER[0], LADDER[1], LADDER[2]];          // never paid / 33: no lower tier
  if (idx === top) return [LADDER[top], LADDER[top], LADDER[top]];  // spec example 2
  return [idx - 1, idx, idx + 1].map(i => LADDER[Math.min(i, top)]);
}

const dayOf = sec => Math.floor(sec / 86400);
const currentTiers = () => state.tiers || tiersFor(state.maxSingle);

function stageInfo(s) {
  const st = state.stages[s];
  if (st.purchasedAt != null) return { status: "purchased" };
  const unlockedAt = s === 0 ? state.triggeredAt : state.stages[s - 1].purchasedAt;
  if (unlockedAt == null) {
    const prev = stageInfo(s - 1).status;
    return { status: prev === "expired" || prev === "closed" ? "closed" : "locked" };
  }
  const deadline = unlockedAt + STAGE_WINDOW_SEC;
  if (state.now >= deadline) return { status: "expired", deadline };
  return { status: "open", deadline };
}

function cardState(s, k) {
  const st = state.stages[s];
  if (st.purchasedAt == null) return { kind: "preview" };
  if (st.claimed[k]) return { kind: "claimed" };
  const avail = dayOf(st.purchasedAt) + k;
  const today = dayOf(state.now);
  if (today < avail) return { kind: "pending", inDays: avail - today };
  return { kind: today > avail ? "makeup" : "claimable" };
}

function rewardsFor(s, k) {
  const price = currentTiers()[s];
  const coins = Math.round(price * STAGE_RATIOS[s].days[k] * COIN_PER_NTD / 100);
  const out = [];
  if (k === 0) {
    const fullCoins = price * COIN_PER_NTD;
    out.push({ id: "coin", amt: fullCoins }, { id: "dragon", amt: (coins - fullCoins) * DRAGON_PER_COIN });
  } else if (k === 1) {
    out.push({ id: "coin", amt: coins }, { id: "crit", amt: CRIT_BONUS.find(([max]) => price <= max)[1], bonus: true });
  } else {
    out.push({ id: "coin", amt: coins }, { id: s === 2 ? "gold" : "dice", amt: 1, bonus: true });
  }
  return out.sort(byItemOrder);
}

// Actual value ratio including bonus items (panel only; the popup shows the currency-only %)
function actualPct(s) {
  const base = currentTiers()[s] * COIN_PER_NTD / 100;
  const items = [0, 1, 2].flatMap(k => rewardsFor(s, k)).filter(r => r.bonus).reduce((t, r) => t + ITEM_COIN_VALUE[r.id] * r.amt, 0);
  return Math.round(STAGE_RATIOS[s].total + items / base);
}

function claimableList(s) {
  return [0, 1, 2].filter(k => ["claimable", "makeup"].includes(cardState(s, k).kind));
}

function packAlive() {
  if (state.triggeredAt == null) return false;
  return [0, 1, 2].some(s => {
    const st = stageInfo(s).status;
    return st === "open" || (st === "purchased" && state.stages[s].claimed.includes(false));
  });
}

function nextDeadline() {
  if (!state.stages) return null;
  for (let s = 0; s < 3; s++) {
    const info = stageInfo(s);
    if (info.status === "open") return info.deadline;
  }
  return null;
}

// ===================== FORMAT =====================
const fmtN = n => n.toLocaleString("en-US");
const fmtBig = n => n >= 1e8 ? `${+(n / 1e8).toFixed(2)}億` : n >= 1e5 ? `${+(n / 1e4).toFixed(1)}萬` : fmtN(n);
const pad = n => String(n).padStart(2, "0");
function fmtClock(sec) {
  const d = dayOf(sec), r = sec % 86400;
  return `D${d} ${pad(Math.floor(r / 3600))}:${pad(Math.floor(r / 60) % 60)}:${pad(r % 60)}`;
}
function fmtDur(sec) {
  sec = Math.max(0, sec);
  return `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec / 60) % 60)}:${pad(sec % 60)}`;
}
const pctText = (s, k) => `${STAGE_RATIOS[s].days[k]}%`;

// ===================== ACTIONS =====================
function addLog(msg) {
  state.log.unshift({ t: fmtClock(state.now), msg });
  state.log = state.log.slice(0, 60);
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.getElementById("stage").appendChild(el);
  setTimeout(() => el.remove(), 2700);
}

function playHand(evt) {
  if (state.inMachine == null) state.inMachine = 0;
  state.hands += 1;
  if (state.hands === TRIGGER_HANDS && state.triggeredAt == null) addLog("生涯機台手數達 5 手，回到大廳時跳出首儲禮包");
  if (evt) {
    const plus = document.createElement("div");
    plus.className = "float-plus";
    plus.textContent = "+1 手";
    evt.currentTarget.appendChild(plus);
    setTimeout(() => plus.remove(), 900);
  }
  render();
}

function enterMachine(i) { state.inMachine = i; render(); }
function backToLobby() {
  if (state.inMachine == null) return;
  state.inMachine = null;
  if (state.triggeredAt == null && state.hands >= TRIGGER_HANDS) {
    state.triggeredAt = state.now;
    state.tiers = tiersFor(state.maxSingle);
    state.stages = freshStages();
    state.popup = true;
    state.activeTab = 0;
    addLog(`回到大廳 → 跳出首儲禮包。價位快照：${state.tiers.join(" / ")}`);
  }
  render();
}

function openPopup() { state.inMachine = null; state.popup = true; render(); }
function closePopup() { state.popup = false; state.dialog = null; render(); }
function selectTab(s) { state.activeTab = s; render(); }

function askBuy(s) { state.dialog = { type: "buy", s }; render(); }
function confirmBuy() {
  const s = state.dialog.s;
  state.stages[s].purchasedAt = state.now;
  addLog(`購買${STEP_NAMES[s]} NTD ${fmtN(currentTiers()[s])}`);
  claim(s, [0], true);  // day 1 is granted automatically on payment; days 2-3 are claimed manually
  toast(s < 2 ? `購買成功！${STEP_NAMES[s + 1]}方案已解鎖（限時 48 小時）` : "購買成功！三階方案全部完成");
}

function claim(s, ks, auto = false) {
  if (!ks.length) return;
  const bag = {};
  ks.forEach(k => {
    state.stages[s].claimed[k] = true;
    rewardsFor(s, k).forEach(({ id, amt }) => { bag[id] = (bag[id] || 0) + amt; });
  });
  Object.entries(bag).forEach(([id, amt]) => { state.balances[id] = (state.balances[id] || 0) + amt; });
  addLog(`${auto ? "自動發放" : "領取"}${STEP_NAMES[s]} ${ks.map(k => DAY_NAMES[k]).join("、")}`);
  state.dialog = { type: "reward", bag, title: auto ? "購買成功" : "恭喜獲得", sub: auto ? `已自動發放${DAY_NAMES[0]}獎勵` : "" };
  render();
}

function advance(sec) { state.now += sec; tick(true); }
function toMidnight() { state.now = (dayOf(state.now) + 1) * 86400; tick(true); }

function resetDemo() {
  Object.assign(state, {
    now: START_SEC, hands: 0, inMachine: null, triggeredAt: null, tiers: null, stages: null,
    popup: false, activeTab: 0, dialog: null,
    balances: { coin: 52300, dragon: 120, dice: 0, crit: 0 }, log: [],
  });
  addLog("重置：新玩家（生涯機台手數 0）");
  render();
}

function setMaxSingle(v) {
  state.maxSingle = v;
  if (state.triggeredAt != null) {
    addLog("生涯最高單筆已變更，但價位在觸發時已快照，本次禮包不變");
  }
  render();
}

// ===================== RENDER: STAGE =====================
const MACHINES = [
  ["財神到", "財", "linear-gradient(160deg,#c2185b,#4a0d3a)"],
  ["龍騰四海", "龍", "linear-gradient(160deg,#1f6fd1,#14205a)"],
  ["黃金城", "金", "linear-gradient(160deg,#c77d12,#4d2306)"],

];

function machineHTML() {
  const [n, sym, bg] = MACHINES[state.inMachine];
  const ready = state.triggeredAt == null && state.hands >= TRIGGER_HANDS;
  return `
  <div class="room" style="background:${bg}">

    <button class="spin" onclick="playHand(event)">轉一手</button>
    <div class="room-hint${ready ? " ready" : ""}">${ready

      : `生涯機台手數 <b>${state.hands}${state.triggeredAt == null ? ` / ${TRIGGER_HANDS}` : ""}</b>`}</div>
  </div>`;
}

function lobbyHTML() {
  const alive = packAlive();
  const deadline = nextDeadline();
  const anyClaim = alive && [0, 1, 2].some(s => claimableList(s).length);
  const hint = state.triggeredAt != null
    ? `生涯機台手數 <b>${state.hands}</b> · 首儲禮包已觸發`
    : `生涯機台手數 <b>${state.hands} / ${TRIGGER_HANDS}</b> · 打滿 5 手後回到大廳即開啟首儲禮包`;

  return `

        ${deadline != null ? `<div class="chip" data-timer="deadline">${fmtDur(deadline - state.now)}</div>` : `<div class="chip">領獎中</div>`}
      </div>` : ""}

}

function skinCardHTML(s, k) {

  const pill = {

  const [ix, iw, ih] = L.icon;
  const rows = rewardsFor(s, k).map(({ id, amt, bonus }, i) => `
    <img class="row-ico ${id === "dice" ? "plain" : ""}" src="${ART[ITEMS[id].art]}" style="left:${ix}px;top:${L.rows[i] + (L.rowH - ih) / 2}px;width:${iw}px;height:${ih}px" alt="">

      <div class="nm">${ITEMS[id].short}${bonus ? `<span class="bonus">加贈</span>` : ""}</div><div class="am gold">×${fmtBig(amt)}</div>
    </div>`).join("");
  return `
  <div class="skin-card ${cs.kind} ${clickable ? "clickable" : ""}" style="${px(c.r)}" ${clickable ? `onclick="claim(${s},[${k}])"` : ""}>
    <div class="hd box" style="transform:translateX(${c.hdShift || 0}px)"><span class="n">${DAY_NAMES[k]}</span><span class="p gold">${pctText(s, k)}</span></div>
    ${rows}
    ${cs.kind === "claimed" ? `<div class="shade"></div><div class="stamp">已領取</div>` : ""}
    ${clickable ? `<div class="glow"></div><div class="dot">!</div>` : ""}
    ${pill ? `<div class="pill">${pill}</div>` : ""}
  </div>`;
}

function skinCtaHTML(s) {
  const L = skinLayout();
  const info = stageInfo(s);
  const price = currentTiers()[s];
  const at = px(L.cta);
  let btn, note;
  if (info.status === "open") {
    btn = `<button class="skin-cta buy" style="${at}" onclick="askBuy(${s})">NTD ${fmtN(price)}</button>`;
    note = "付款後自動發放第一天獎勵，第二、三天每日 00:00 開放領取";
  } else if (info.status === "purchased") {
    const ks = claimableList(s);
    const left = state.stages[s].claimed.filter(c => !c).length;
    if (ks.length) {
      btn = `<button class="skin-cta claim" style="${at}" onclick="claim(${s},[${ks.join(",")}])">領取獎勵${ks.length > 1 ? `<small>×${ks.length}</small>` : ""}</button>`;
      note = ks.some(k => cardState(s, k).kind === "makeup") ? "含未領取的前幾天獎勵，可一次補領" : "今日獎勵已開放";
    } else if (left) {
      btn = `<button class="skin-cta" style="${at}" disabled>下一份 <span data-timer="midnight">${fmtDur((dayOf(state.now) + 1) * 86400 - state.now)}</span> 後開放</button>`;
      note = "未領取的獎勵不會消失，可隨時補領";
    } else {
      btn = `<button class="skin-cta" style="${at}" disabled>✔ 已全部領取</button>`;
      note = "感謝支持！";
    }
  } else if (info.status === "locked") {
    btn = `<button class="skin-cta" style="${at}" disabled>購買${STEP_NAMES[s - 1]}後解鎖</button>`;
    note = "解鎖後限時 48 小時可購買";
  } else if (info.status === "expired") {
    btn = `<button class="skin-cta" style="${at}" disabled>已逾期</button>`;
    note = "此階方案已超過 48 小時購買期限";
  } else {
    btn = `<button class="skin-cta" style="${at}" disabled>方案已結束</button>`;
    note = "前一階未在期限內購買";
  }
  return `${btn}<div class="skin-note box" style="${px(L.note)}">${note}</div>`;
}

function packHTML() {
  const L = skinLayout();
  const s = state.activeTab;
  const [W, H] = L.size;
  const [SW, SH] = state.orient === "land" ? [1280, 720] : [720, 1280];
  const k = Math.min(SW / W, SH / H) * 0.98;
  const vars = Object.entries(L.vars).map(([n, v]) => `--${n}:${v}px`).join(";");
  return `
  <div class="overlay">
    <div class="skin-frame" style="width:${W * k}px;height:${H * k}px">
      <div class="skin" style="width:${W}px;height:${H}px;transform:scale(${k});${vars}">
        <img class="skin-base" src="${ART[`${state.orient}_base`]}" style="width:${W}px;height:${H}px" alt="">
        ${[0, 1, 2].map(skinTabHTML).join("")}
        ${skinHeroHTML(s)}
        ${[0, 1, 2].map(day => skinCardHTML(s, day)).join("")}
        ${skinCtaHTML(s)}
        <button class="skin-close" style="${px(L.close)}" onclick="closePopup()" aria-label="關閉">${state.orient === "land" ? "✕" : ""}</button>
        <button class="skin-info" style="${px(L.info)}" onclick="state.dialog={type:'rules'};render()" aria-label="活動規則">?</button>
      </div>
    </div>
  </div>`;
}

function dialogHTML() {
  const d = state.dialog;
  if (!d) return "";
  if (d.type === "buy") {
    const price = currentTiers()[d.s];
    return `<div class="dlg-wrap"><div class="dlg">
      <h3>確認儲值</h3>
      <p>${STEP_NAMES[d.s]}方案 · <b>NTD ${fmtN(price)}</b></p>
      <p class="demo-tag">（Demo 模擬付款，不會真的扣款）</p>
      <div class="btns"><button class="cancel" onclick="state.dialog=null;render()">取消</button><button class="ok" onclick="confirmBuy()">確認付款</button></div>
    </div></div>`;
  }
  if (d.type === "reward") {
    return `<div class="dlg-wrap"><div class="dlg">
      <h3>${d.title}</h3>
      ${d.sub ? `<p>${d.sub}</p>` : ""}
      <div class="reward-grid">${Object.entries(d.bag).sort(([a], [b]) => ITEM_ORDER.indexOf(a) - ITEM_ORDER.indexOf(b)).map(([id, amt]) => `
        <div class="ri">${ITEMS[id].icon()}<div class="iname">${ITEMS[id].name}</div><div class="iamt">×${fmtBig(amt)}</div></div>`).join("")}</div>
      <p class="demo-tag">（公版獲獎 Dialog 位置，編號待定）</p>
      <div class="btns"><button class="ok" onclick="state.dialog=null;render()">確定</button></div>
    </div></div>`;
  }
  if (d.type === "rules") {
    return `<div class="dlg-wrap"><div class="dlg" style="width:640px">
      <h3>活動規則</h3>
      <ol class="rules">
        <li>生涯機台手數未滿 5 手的玩家，累積遊玩達 5 手後回到一般／VIP 娛樂城大廳，即開啟首儲禮包。</li>
        <li>禮包共三階方案，依序開放：購買前一階後解鎖下一階。</li>
        <li>每階方案開放後限時 48 小時，逾時未購買則該階及後續方案關閉。</li>
        <li>方案價位依您的儲值紀錄提供。</li>
        <li>付款後自動發放第一天獎勵；第二、三天獎勵於每日 00:00 開放，需手動領取，未領取的獎勵可隨時補領。</li>
        <li>每個帳號限購一次。</li>
      </ol>
      <div class="btns"><button class="ok" onclick="state.dialog=null;render()">我知道了</button></div>
    </div></div>`;
  }
  return "";
}

// ===================== RENDER: PANEL =====================
function panelHTML() {
  const tiers = tiersFor(state.maxSingle);
  const snap = state.tiers;
  const idx = state.maxSingle == null ? -1 : ladderIndex(state.maxSingle);
  const mapped = idx >= 0 ? LADDER[idx] : null;
  const offLadder = state.maxSingle != null && mapped !== state.maxSingle;
  const opts = [`<option value="none" ${state.maxSingle == null ? "selected" : ""}>未儲值過</option>`]
    .concat(LADDER.map(p => `<option value="${p}" ${state.maxSingle === p ? "selected" : ""}>${fmtN(p)}</option>`));
  const isCustom = state.maxSingle != null && !LADDER.includes(state.maxSingle);
  if (isCustom) opts.push(`<option value="custom" selected>自訂 ${fmtN(state.maxSingle)}</option>`);

  const statusRows = state.stages ? [0, 1, 2].map(s => {
    const info = stageInfo(s);
    const label = { open: "可購買", purchased: "已購買", locked: "未解鎖", expired: "已逾期", closed: "已結束" }[info.status];
    const claimed = state.stages[s].claimed.filter(Boolean).length;
    return `<span>${STEP_NAMES[s]}</span><span>${label}${info.status === "purchased" ? `（已領 ${claimed}/3）` : ""}</span>`;
  }).join("") : `<span>禮包</span><span>未觸發</span>`;

  return `
  <h2>① 玩家條件</h2>
  <div class="row">
    <label>生涯單筆最高</label>
    <select id="maxSel">${opts.join("")}</select>
  </div>
  <div class="row">
    <label>自訂金額</label>
    <input type="number" id="maxCustom" min="1" placeholder="例 500">
    <button class="btn" id="maxCustomBtn">套用</button>
  </div>
  ${offLadder ? `<div class="note">${fmtN(state.maxSingle)} 不在價位表上 → 往下對應 <b>${fmtN(mapped)}</b></div>` : ""}
  <div class="row"><span class="note">對應三階價位${snap && snap.join() !== tiers.join() ? "（下一次觸發）" : ""}：</span></div>
  <div class="tier-chips">${tiers.map((p, i) => `<div><small>${STEP_NAMES[i]}</small><b>${fmtN(p)}</b></div>`).join("")}</div>
  ${snap && snap.join() !== tiers.join() ? `<div class="note alert">本次禮包已在觸發時快照為 ${snap.map(fmtN).join(" / ")}，改設定不影響進行中的禮包。按「重置」套用新設定。</div>` : ""}
  <div class="note">價位表（假設，待提供）：${LADDER.map(fmtN).join(" / ")}</div>

  <h2>② 優惠比</h2>
  <table class="ratio-table">
    <tr><th>階段</th><th>總優惠</th><th>第一 / 二 / 三天</th></tr>
    ${STAGE_RATIOS.map((r, i) => `<tr><td>${STEP_NAMES[i]}</td><td>${r.total}%</td><td>${r.days.map(d => d + "%").join(" / ")}</td></tr>`).join("")}
  </table>
  <div class="note">顯示 % 只算神幣＋龍幣（1 元 = 100 神幣，1 神幣 = 10,000 龍幣）；道具為加贈不計入。含道具商城標價的實際 %：${[0, 1, 2].map(i => `${STEP_NAMES[i]} ${actualPct(i)}%`).join("、")}（依目前價位）。</div>

  <h2>③ 流程操作</h2>
  <div class="kv">
    <span>遊戲時間</span><span data-timer="clock">${fmtClock(state.now)}</span>
    <span>機台手數</span><span>${state.hands} / ${TRIGGER_HANDS}</span>
    ${statusRows}
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn primary" onclick="playHand()">+1 手</button>
    <button class="btn" onclick="for(let i=0;i<5;i++) playHand()">+5 手</button>
    <button class="btn" onclick="backToLobby()" ${state.inMachine == null ? "disabled" : ""}>返回大廳</button>
    <button class="btn" onclick="advance(3600)">+1 小時</button>
    <button class="btn" onclick="advance(12*3600)">+12 小時</button>
    <button class="btn" onclick="advance(86400)">+1 天</button>
    <button class="btn" onclick="toMidnight()">跳到 00:00</button>
  </div>
  <div class="row">
    <button class="btn" onclick="state.paused=!state.paused;render()">${state.paused ? "▶ 時間繼續" : "⏸ 時間暫停"}</button>
    <button class="btn warn" onclick="resetDemo()">重置</button>
  </div>
  <div class="note">試玩建議：點大廳機台進入 → 轉 5 手 → 返回大廳自動跳出禮包 → 購買第一階 → 領第一天 → 「+1 天」看第二天開放與補領 → 「+12 小時」×4 看 48 小時逾期。</div>

  <h2>④ 事件紀錄</h2>
  <ul class="log">${state.log.map(l => `<li><time>${l.t}</time>${l.msg}</li>`).join("")}</ul>
  `;
}

// ===================== RENDER LOOP =====================
let lastSig = "";
let prevStatuses = null;

function signature() {
  const parts = [state.orient, state.hands, state.inMachine, state.triggeredAt, state.popup, state.activeTab, JSON.stringify(state.dialog), state.maxSingle, state.paused, state.log.length];
  if (state.stages) {
    for (let s = 0; s < 3; s++) {
      parts.push(stageInfo(s).status);
      for (let k = 0; k < 3; k++) parts.push(JSON.stringify(cardState(s, k)));
    }
  }
  parts.push(packAlive());
  return parts.join("|");
}

let lastPopupOpen = false;
let lastDialogKey = null;

function render() {
  detectTransitions();
  if (state.popup && !packAlive()) state.popup = false;
  const stage = document.getElementById("stage");
  stage.className = `stage ${state.orient}`;
  stage.innerHTML = lobbyHTML() + (state.inMachine != null ? machineHTML() : "") + (state.popup ? packHTML() : "") + (state.popup ? dialogHTML() : "");
  const dialogKey = state.popup && state.dialog ? state.dialog.type : null;
  if (state.popup && !lastPopupOpen) stage.querySelector(".overlay").classList.add("enter");
  if (dialogKey && dialogKey !== lastDialogKey) stage.querySelector(".dlg-wrap").classList.add("enter");
  lastPopupOpen = state.popup;
  lastDialogKey = dialogKey;
  document.getElementById("panel").innerHTML = panelHTML();
  bindPanel();
  updateTimers();
  lastSig = signature();
  fit();
}

function updateTimers() {
  document.getElementById("clockText").textContent = fmtClock(state.now);
  const deadline = nextDeadline();
  document.querySelectorAll("[data-timer]").forEach(el => {
    const key = el.dataset.timer;
    let v = null;
    if (key === "deadline" && deadline != null) v = deadline - state.now;
    else if (key === "midnight") v = (dayOf(state.now) + 1) * 86400 - state.now;
    else if (key.startsWith("stage")) {
      const info = stageInfo(Number(key.slice(5)));
      if (info.deadline) v = info.deadline - state.now;
    }
    if (key === "clock") el.textContent = fmtClock(state.now);
    else if (v != null) el.textContent = fmtDur(v);
  });
}

function detectTransitions() {
  if (!state.stages) { prevStatuses = null; return; }
  const cur = [0, 1, 2].map(s => stageInfo(s).status);
  if (prevStatuses) {
    cur.forEach((st, s) => {
      if (prevStatuses[s] === "open" && st === "expired") addLog(`${STEP_NAMES[s]}逾期未購買，後續方案關閉`);
    });
    const wasAlive = prevStatuses.alive;
    const alive = packAlive();
    if (wasAlive && !alive) addLog("禮包結束，大廳入口消失");
    cur.alive = alive;
  } else {
    cur.alive = packAlive();
  }
  prevStatuses = cur;
}

function tick(force) {
  detectTransitions();
  if (force || signature() !== lastSig) render();
  else updateTimers();
}

setInterval(() => {
  if (!state.paused) state.now += 1;
  tick(false);
}, 1000);

// ===================== PANEL BINDINGS =====================
function bindPanel() {
  document.getElementById("maxSel").onchange = e => {
    const v = e.target.value;
    if (v === "custom") return;
    setMaxSingle(v === "none" ? null : Number(v));
  };
  document.getElementById("maxCustomBtn").onclick = () => {
    const v = Number(document.getElementById("maxCustom").value);
    if (v > 0) setMaxSingle(v);
  };
}

document.querySelectorAll("#orientSeg button").forEach(b => {
  b.onclick = () => {
    state.orient = b.dataset.o;
    document.querySelectorAll("#orientSeg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  };
});

// ===================== SCALE TO FIT =====================
function fit() {
  const area = document.getElementById("area");
  const holder = document.getElementById("holder");
  const stage = document.getElementById("stage");
  const W = state.orient === "land" ? 1280 : 720;
  const H = state.orient === "land" ? 720 : 1280;
  const cs = getComputedStyle(area);
  const aw = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const scale = Math.max(0.1, Math.min(aw / W, ah / H));
  stage.style.transform = `scale(${scale})`;
  holder.style.width = `${W * scale}px`;
  holder.style.height = `${H * scale}px`;
}
window.addEventListener("resize", fit);

addLog("新玩家（生涯機台手數 0）");
render();
</script>
